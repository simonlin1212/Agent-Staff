# ── 🗂 行政部(职能)──
[agents.admin]
enabled = true
delegate_same_risk_profile = true
model_provider = "anthropic.main"
mcp_bundles = ["admin"]
risk_profile = "standard"
channels = ["lark.admin", "feishu.admin"]
