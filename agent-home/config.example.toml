# ════════════════ 飞书渠道(每部门一个自建应用 bot)════════════════
# app_id / app_secret 从飞书开放平台你的自建应用里拿。海外 Lark 同理。
# ⚠️ external_peers:群里 @ 要填【群 chat_id(oc_)】不是 open_id!跑 scripts/list_chats.py 拿。
#    私聊才用 open_id(ou_)。作用 = 锁定谁能跟这个部门 agent 说话(私聊 + 群都管)。
[channels.lark.ceo]
app_id = "<CEO_BOT_APP_ID>"
app_secret = "<CEO_BOT_APP_SECRET>"
use_feishu = true
receive_mode = "websocket"
enabled = true
[peer_groups.ceo]
channel = "lark.ceo"
agents = ["ceo"]
external_peers = ["<CEO群_chat_id_oc...>"]

[channels.lark.media]
