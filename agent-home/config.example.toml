# ╔══════════════════════════════════════════════════════════════╗
# ║  Agent-Staff · zeroclaw 配置模板                                ║
# ║  复制成 config.toml 后,把所有 <...> 占位符换成你自己的值。      ║
# ║  ⚠️ config.toml 已被 .gitignore,绝不会提交真密钥。            ║
# ║                                                                ║
# ║  这是一套【完整公司组织架构】的示例(9 个部门 agent):          ║
# ║    🏛 CEO 参谋长(公司)                                        ║
# ║    营收:📱自媒体运营部  🛒电商部  💼业务部                     ║
# ║    职能:💰财务部  👥人力部  🗂行政部  📊运营部  🛡合规部        ║
# ║  删掉你不需要的部门、或照葫芦画瓢加更多——每个部门都是同一套      ║
# ║  五件套:[agents.X] + [[mcp.servers]] + [mcp_bundles.X] +       ║
# ║          [channels.lark.X] + [peer_groups.X]。                 ║
# ╚══════════════════════════════════════════════════════════════╝

schema_version = 3

[memory]
search_mode = "bm25"

[heartbeat]
enabled = false
agent = "ceo"
interval_minutes = 60

[risk_profiles.standard]
level = "full"

# ── 模型(任选其一)── zeroclaw 支持 Claude / DeepSeek / Minimax / Qwen / GLM / OpenRouter / 本地 Ollama 等。
# 每个 agent 的 model_provider 指向下面某个 <type>.<alias>。默认 anthropic.main;想换模型只改 agent 那一行。
#
# 鉴权两种都行,而且可并存(不同 agent 用不同的,或 fallback 互为备用):
#   ① 订阅:跑 `zeroclaw auth paste-token`(Claude 订阅)或 `auth login`(OpenAI/Gemini/xAI OAuth);
#          或把订阅 OAuth token 加密后放进下面的 api_key。
#   ② 单独 API key(按量付费):把各家 dashboard 的 API key 放进 api_key。
# ⚠️ 一律加密存(zeroclaw keyring),别把明文密钥写进 config.toml。

# 选项 A:Claude(订阅或 API)
[providers.models.anthropic.main]
model = "claude-opus-4-8"
api_key = "<YOUR_KEY>"

# 选项 B:DeepSeek(OpenAI 兼容)—— 取消注释即用,并把各 agent 的 model_provider 改成 "deepseek.main"
# [providers.models.deepseek.main]
# kind = "openai-compatible"
# uri = "https://api.deepseek.com/v1"
# model = "deepseek-chat"
# api_key = "<YOUR_DEEPSEEK_KEY>"

# 选项 C:Minimax / 其他 OpenAI 兼容服务(uri 以各家官方文档为准)
# [providers.models.minimax.main]
# kind = "openai-compatible"
# uri = "<该服务的 OpenAI 兼容端点>"
# model = "<模型 ID>"
# api_key = "<YOUR_KEY>"

# ════════════════ Agents(9 个部门)════════════════
# 每个 agent:一个部门人设 + 一个 codata MCP(--dept 指向它的部门)+ 一个飞书 bot 渠道 + 一个白名单。
# 想给某部门换模型:改它的 model_provider(如 deepseek.main)。想省钱:职能部门用便宜模型、CEO 用强模型。

# ── 🏛 CEO 参谋长(唯一能跨部门看全局)──
[agents.ceo]
enabled = true
delegate_same_risk_profile = true
model_provider = "anthropic.main"   # 想用 DeepSeek/Minimax 就改成 deepseek.main / minimax.main
mcp_bundles = ["ceo"]
risk_profile = "standard"
channels = ["lark.ceo", "feishu.ceo"]
cron_jobs = ["daily_review"]            # 每日经营巡检(见文末 [cron.*])
[agents.ceo.memory]
backend = "sqlite"
[agents.ceo.identity]
format = "openclaw"

# ── 📱 自媒体运营部(营收)──
[agents.media]
enabled = true
delegate_same_risk_profile = true
model_provider = "anthropic.main"
mcp_bundles = ["media"]
risk_profile = "standard"
channels = ["lark.media", "feishu.media"]
[agents.media.memory]
backend = "sqlite"
[agents.media.identity]
format = "openclaw"

# ── 🛒 电商部(营收)──
[agents.ecom]
enabled = true
delegate_same_risk_profile = true
model_provider = "anthropic.main"
mcp_bundles = ["ecom"]
risk_profile = "standard"
channels = ["lark.ecom", "feishu.ecom"]
[agents.ecom.memory]
backend = "sqlite"
[agents.ecom.identity]
format = "openclaw"

# ── 💼 业务部(营收)──
[agents.biz]
enabled = true
delegate_same_risk_profile = true
model_provider = "anthropic.main"
mcp_bundles = ["biz"]
risk_profile = "standard"
channels = ["lark.biz", "feishu.biz"]
[agents.biz.memory]
backend = "sqlite"
[agents.biz.identity]
format = "openclaw"

# ── 💰 财务部(职能)──
[agents.finance]
enabled = true
delegate_same_risk_profile = true
model_provider = "anthropic.main"
mcp_bundles = ["finance"]
risk_profile = "standard"
channels = ["lark.finance", "feishu.finance"]
cron_jobs = ["finance_weekly"]
[agents.finance.memory]
backend = "sqlite"
[agents.finance.identity]
format = "openclaw"

# ── 👥 人力部(职能)──
[agents.hr]
enabled = true
delegate_same_risk_profile = true
model_provider = "anthropic.main"
mcp_bundles = ["hr"]
risk_profile = "standard"
channels = ["lark.hr", "feishu.hr"]
[agents.hr.memory]
backend = "sqlite"
