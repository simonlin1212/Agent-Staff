# ════════════════ codata MCP(每部门一个)════════════════
# ⚠️ 把下面 args 里的路径换成你机器上 Agent-Staff/agent-os/feishu_mcp.py 的绝对路径。
# command 用 "python3"(靠 PATH 找)即可;不行就写绝对路径(which python3 查)。setup 向导会自动填对。
# --dept 的值必须和 dept_registry.json 里的部门名完全一致。
[[mcp.servers]]
name = "codata_ceo"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "公司"]

[[mcp.servers]]
name = "codata_media"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "自媒体运营部"]

[[mcp.servers]]
name = "codata_ecom"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "电商部"]

[[mcp.servers]]
name = "codata_biz"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "业务部"]

[[mcp.servers]]
name = "codata_finance"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "财务部"]

[[mcp.servers]]
name = "codata_hr"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "人力部"]

[[mcp.servers]]
name = "codata_admin"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "行政部"]

[[mcp.servers]]
name = "codata_ops"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "运营部"]

[[mcp.servers]]
name = "codata_compliance"
transport = "stdio"
command = "python3"
args = ["<ABS_PATH>/Agent-Staff/agent-os/feishu_mcp.py", "--dept", "合规部"]

[mcp_bundles.ceo]
servers = ["codata_ceo"]
[mcp_bundles.media]
servers = ["codata_media"]
[mcp_bundles.ecom]
servers = ["codata_ecom"]
[mcp_bundles.biz]
servers = ["codata_biz"]
[mcp_bundles.finance]
servers = ["codata_finance"]
[mcp_bundles.hr]
servers = ["codata_hr"]
[mcp_bundles.admin]
servers = ["codata_admin"]
[mcp_bundles.ops]
