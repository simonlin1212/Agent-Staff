# ════════════════ 主动预警 cron(可选,示例 3 个)════════════════
# ⚠️ cron 别名必须是 ASCII(TOML 表头键不能用中文);中文放 name= 字段。
# ⚠️ 要 cron 生效,启动必须用 `daemon` 模式(channel start 不带调度器)。
[cron.daily_review]
name = "每日经营巡检"
job_type = "agent"
prompt = "调用 analyze 拿全公司聚合,要点列各部门关键指标;有异常就开头标【预警】点名,否则【今日正常】。只报工具返回的真实数字。"
schedule = { kind = "cron", expr = "30 8 * * *", tz = "Asia/Shanghai" }
[cron.daily_review.delivery]
mode = "announce"
channel = "lark.ceo"
to = "<CEO_GROUP_CHAT_ID>"

[cron.finance_weekly]
name = "财务周报"
job_type = "agent"
prompt = "每周财务巡检。调用 analyze 拿损益,2-3 句讲清净利润/收入/支出;有异常标【异常预警】,否则【本周正常】。只报真实数字。"
schedule = { kind = "cron", expr = "0 9 * * 1", tz = "Asia/Shanghai" }
[cron.finance_weekly.delivery]
mode = "announce"
channel = "lark.finance"
to = "<FINANCE_GROUP_CHAT_ID>"

[cron.contract_expiry]
name = "合同证照到期提醒"
job_type = "agent"
prompt = "巡检「合同档案」,列 60 天内即将到期或已过期的合同/证照,点名提醒续约。都没有就回【近期无到期】。只报真实数据。"
schedule = { kind = "cron", expr = "0 9 * * 1", tz = "Asia/Shanghai" }
[cron.contract_expiry.delivery]
mode = "announce"
channel = "lark.admin"
to = "<ADMIN_GROUP_CHAT_ID>"
